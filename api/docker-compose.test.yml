services:
  test-db:
    image: postgres:16-alpine
    container_name: feedvita-test-db
    environment:
      POSTGRES_USER: feedvita
      POSTGRES_PASSWORD: feedvita
      POSTGRES_DB: feedvita_test
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U feedvita -d feedvita_test']
      interval: 2s
      timeout: 3s
      retries: 15
